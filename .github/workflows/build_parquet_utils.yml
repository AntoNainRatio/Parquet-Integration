name: Build parquet_utils

on:
  push:
    paths:
      - 'parquet_utils/**'
      - '.github/workflows/test_parquet_utils.yml'
  pull_request:
    paths:
      - 'parquet_utils/**'
      - '.github/workflows/test_parquet_utils.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f993fc42532591aeb07328bbe0add868b0629d0f'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Install vcpkg packages
        run: |
          ${GITHUB_WORKSPACE}/vcpkg/vcpkg install


      - name: Configure CMake
        run: |
            cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
                -DCMAKE_BUILD_TYPE=Release


      - name: Build parquet_utils
        run: cmake --build build --config Release
